<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Supply Chain Guardian</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M8 1l6 2.5v4C14 11 11.5 14 8 15 4.5 14 2 11 2 7.5v-4z' fill='%230f6e6a'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1l6 2.5v4C14 11 11.5 14 8 15 4.5 14 2 11 2 7.5v-4z"/></svg>
        <span>Software Supply Chain Guardian</span>
      </div>
      <label class="app-select">
        <span class="label">Application</span>
        <select id="app-select" aria-label="Application"></select>
      </label>
      <dl class="run-meta" id="run-meta"></dl>
    </div>
  </header>

  <main class="container">
    <nav class="pipeline" id="pipeline" aria-label="Pipeline stages"></nav>
    <section id="panel" class="panel" aria-live="polite"></section>
  </main>

  <footer class="container footer">
    <span id="poll-status">Refreshing every 5 s</span>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
